          type: string
        expiry_date:
          format: date-time
          type: string
        id:
          type: integer
        is_active:
          type: boolean
        source:
          type: string
        type:
          type: string
        updated_at:
          format: date-time
          type: string
        user_id:
          type: integer
      required:
      - id
      - user_id
      - type
      - source
      - bytes
      - bytes_used
      - bytes_remaining
      - expiry_date
      - is_active
      - created_at
      - updated_at
      type: object
    AllowanceListResponse:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: '#/components/schemas/AllowanceGrantResponse'
          type: array
        total:
          type: integer
      required:
      - data
      - total
      type: object
    CleanupRequest:
      additionalProperties: false
      properties:
        retention_days:
          type: integer
      required:
      - retention_days
      type: object
    CleanupResponse:
      additionalProperties: false
      properties:
        records_deleted:
