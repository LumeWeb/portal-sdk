info:
  description: Provides administrative endpoints for managing the Portal.
  title: Portal Admin API
  version: unknown
openapi: 3.0.0
paths:
  /api/ipfs/websites/{id}/block:
    post:
      description: |-
        Blocks a website by setting status to 'blocked'.

        Admin-only operation that prevents deletion of problematic websites. Blocked websites remain in the system but cannot be modified or removed by users.

        Prerequisites: Admin access required

        See also: POST /websites/:id/unblock (unblock website)
      parameters:
      - description: Website ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteResponse'
          description: Website blocked
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Block website
      tags:
      - Admin
      - Websites
      - Content
  /api/ipfs/websites/{id}/unblock:
    post:
      description: |-
        Unblocks a website by restoring status to 'active'.

        Admin-only operation that re-enables a previously blocked website, allowing users to manage it again.

        Prerequisites: Admin access required

        See also: POST /websites/:id/block (block website)
      parameters:
      - description: Website ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteResponse'
          description: Website unblocked
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Unblock website
      tags:
      - Admin
      - Websites
      - Content
  /api/quota/allowances:
    get:
      description: Get a paginated list of all allowance grants
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowanceListResponse'
          description: List of allowance grants
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "404":
