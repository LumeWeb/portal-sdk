info:
  description: Provides administrative endpoints for managing the Portal.
  title: Portal Admin API
  version: unknown
openapi: 3.0.0
paths:
  /api/billing/credits:
    get:
      description: Retrieves all credits with filtering, sorting, and pagination support
      parameters:
      - description: Filter by direction contains
        in: query
        name: direction_contains
        schema:
          type: string
      - description: Filter by direction endswith
        in: query
        name: direction_endswith
        schema:
          type: string
      - description: Filter by direction eq
        in: query
        name: direction_eq
        schema:
          type: string
      - description: Filter by direction ne
        in: query
        name: direction_ne
        schema:
          type: string
      - description: Filter by direction startswith
        in: query
        name: direction_startswith
        schema:
          type: string
      - description: Filter by direction contains
        in: query
        name: filters[direction][contains]
        schema:
          type: string
      - description: Filter by direction endswith
        in: query
        name: filters[direction][endswith]
        schema:
          type: string
      - description: Filter by direction eq
        in: query
        name: filters[direction][eq]
        schema:
          type: string
      - description: Filter by direction ne
        in: query
        name: filters[direction][ne]
        schema:
          type: string
      - description: Filter by direction startswith
        in: query
        name: filters[direction][startswith]
        schema:
          type: string
      - description: Filter by transaction_type contains
        in: query
        name: filters[transaction_type][contains]
        schema:
          type: string
      - description: Filter by transaction_type endswith
        in: query
        name: filters[transaction_type][endswith]
        schema:
          type: string
      - description: Filter by transaction_type eq
        in: query
        name: filters[transaction_type][eq]
        schema:
          type: string
      - description: Filter by transaction_type ne
        in: query
        name: filters[transaction_type][ne]
        schema:
          type: string
      - description: Filter by transaction_type startswith
        in: query
        name: filters[transaction_type][startswith]
        schema:
          type: string
      - description: Filter by user_id between
        in: query
        name: filters[user_id][between]
        schema:
          type: string
      - description: Filter by user_id eq
        in: query
        name: filters[user_id][eq]
        schema:
          type: string
      - description: Filter by user_id gt
        in: query
        name: filters[user_id][gt]
        schema:
          type: string
      - description: Filter by user_id gte
        in: query
        name: filters[user_id][gte]
        schema:
          type: string
      - description: Filter by user_id lt
        in: query
        name: filters[user_id][lt]
        schema:
          type: string
      - description: Filter by user_id lte
        in: query
        name: filters[user_id][lte]
        schema:
          type: string
      - description: Filter by user_id ne
        in: query
        name: filters[user_id][ne]
        schema:
          type: string
      - description: Filter by transaction_type contains
        in: query
        name: transaction_type_contains
        schema:
          type: string
      - description: Filter by transaction_type endswith
        in: query
        name: transaction_type_endswith
        schema:
          type: string
      - description: Filter by transaction_type eq
        in: query
        name: transaction_type_eq
        schema:
          type: string
      - description: Filter by transaction_type ne
        in: query
        name: transaction_type_ne
        schema:
          type: string
      - description: Filter by transaction_type startswith
        in: query
        name: transaction_type_startswith
        schema:
          type: string
      - description: Filter by user_id eq
        in: query
        name: user_id_eq
        schema:
          type: string
      - description: Filter by user_id gt
        in: query
        name: user_id_gt
        schema:
          type: string
      - description: Filter by user_id gte
        in: query
        name: user_id_gte
        schema:
          type: string
      - description: Filter by user_id lt
        in: query
        name: user_id_lt
        schema:
          type: string
      - description: Filter by user_id lte
        in: query
        name: user_id_lte
        schema:
          type: string
      - description: Filter by user_id ne
        in: query
        name: user_id_ne
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditsListResponse'
          description: Credits retrieved successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Server error
      summary: List Credits
      tags:
      - Billing Admin
    post:
      description: Creates a new credit entry. Returns 201 for new credits or 200
        if credit already exists (idempotent via reference_id)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditCreateRequest'
        description: Credit creation request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditResponse'
          description: Credit already exists (idempotent)
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditResponse'
          description: Credit created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Server error
      summary: Create Credit
      tags:
      - Billing Admin
  /api/billing/credits/{id}:
    delete:
      description: Soft deletes a credit entry
      parameters:
      - description: Credit ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Credit deleted successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
