          description: Internal server error
      summary: List allowance grants
      tags:
      - quota
      - grants
    post:
      description: Create a new allowance grant for a user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllowanceGrantRequest'
        description: Allowance grant configuration
        required: true
      responses:
