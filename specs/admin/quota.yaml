          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Success
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowanceGrantResponse'
          description: Grant created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Create allowance grant
      tags:
      - quota
      - grants
  /api/quota/allowances/{grantID}:
    delete:
      description: Deactivate an allowance grant
      parameters:
      - description: Numeric ID of the allowance grant
        in: path
        name: grantID
        required: true
